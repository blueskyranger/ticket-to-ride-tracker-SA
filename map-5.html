<!DOCTYPE html>
<html lang="af">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seisoenkaart — 5 Spelers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* ---- Theme: Dusty Blue ---- */
    :root {
      --accent:    #1a4a78;
      --border:    #7aa0c8;
      --card-bg:   #eaf0f8;
      --page-bg:   #e0eaf4;
      --sub:       #4a6888;
      --strip-bg:  #d4e2f0;
      --map-inner: #dce8f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 3rem;
    }

    .page-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      width: 100%;
      max-width: 720px;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .back-link {
      font-size: 13px;
      color: var(--sub);
      text-decoration: none;
      white-space: nowrap;
    }
    .back-link:hover { color: var(--accent); }

    .page-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      letter-spacing: 2px;
      color: #1a2e48;
      text-align: center;
    }

    .page-badge {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--sub);
      text-align: right;
      white-space: nowrap;
    }

    .setup-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0.75rem 1rem 0.85rem;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      width: 100%;
      max-width: 720px;
    }

    .setup-label {
      width: 100%;
      text-align: center;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 0.3rem;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.35);
    }

    .player-name {
      font-family: 'Playfair Display', serif;
      font-size: 14px;
      font-weight: 700;
      min-width: 64px;
      transition: color 0.2s;
    }

    .swatches { display: flex; gap: 5px; }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2.5px solid transparent;
      cursor: pointer;
      padding: 0;
      transition: transform 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .swatch:hover:not(:disabled) { transform: scale(1.2); }
    .swatch.selected {
      border-color: #fff;
      box-shadow: 0 0 0 2px #333;
      transform: scale(1.15);
    }
    .swatch.taken {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .map-shell {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
      max-width: 720px;
    }

    .map-hdr { text-align: center; margin-bottom: 0.75rem; }

    .map-hdr-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--accent);
    }

    .map-hdr-sub {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--sub);
      margin-top: 3px;
    }

    .map-rule {
      border: none;
      border-top: 1px solid var(--border);
      margin: 5px auto;
      width: 220px;
    }

    .map-canvas {
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--map-inner);
    }

    .score-strip {
      display: flex;
      margin-top: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--strip-bg);
      overflow: hidden;
    }

    .score-cell {
      flex: 1;
      padding: 8px 6px;
      text-align: center;
      border-right: 1px solid var(--border);
    }
    .score-cell:last-child { border-right: none; }

    .sc-name {
      font-family: 'Playfair Display', serif;
      font-size: 12px;
      display: block;
    }
    .sc-pts {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.1;
      display: block;
    }
    .sc-goal {
      font-size: 9px;
      letter-spacing: 0.5px;
      color: var(--sub);
      display: block;
    }

    /* Tap a stop marker on the map to see that game's result here */
    .game-detail {
      margin-top: 0.75rem;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--strip-bg);
      font-size: 12px;
      color: var(--accent);
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <a href="index.html" class="back-link">← Terug na Puntebord</a>
    <h1 class="page-title">Kaapstad &rarr; Kaïro</h1>
    <span class="page-badge">5 Spelers</span>
  </div>

  <div class="setup-bar" id="setup-bar">
    <p class="setup-label">Kies jou kleur</p>
  </div>

  <div class="map-shell">
    <div class="map-hdr">
      <hr class="map-rule" />
      <p class="map-hdr-title">Die Vyf Kontinente</p>
      <p class="map-hdr-sub">5 Spelers &mdash; Blou Uitgawe</p>
      <hr class="map-rule" />
    </div>
    <div class="map-canvas">
      <svg id="map-svg" width="100%" viewBox="0 0 640 560" style="display:block;"></svg>
    </div>
    <div class="score-strip" id="score-strip"></div>
    <div class="game-detail" id="game-detail">Tik op 'n stop op die kaart om daardie speletjie se uitslag te sien.</div>
  </div>

  <script src="map-shared.js"></script>
  <script>
    // =====================================================
    // 5-PLAYER MAP CONFIG
    // =====================================================
    initSeasonMap({
      playerCount: 5,
      theme: {
        mapBg:       '#dce8f4',
        trackColour: '#7aa0c8',
        cityStroke:  '#7aa0c8',
        termColour:  '#1a4a78',
      },
      offsets: OFFSETS_5,
      fallbackNames: ['Speler 1', 'Speler 2', 'Speler 3', 'Speler 4', 'Speler 5'],
    });
  </script>
</body>
</html>
